<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="RePlate connects surplus food with local NGOs and communities before it goes to waste."
    />
    <title>RePlate | Good food deserves another plate.</title>
    <script>
      // Set the theme before first paint to avoid a flash: saved choice first, else the system setting.
      (() => {
        let theme = null;
        try {
          theme = localStorage.getItem('replate:theme');
        } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
